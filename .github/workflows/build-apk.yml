name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$SDK_MANAGER" --licenses || true
          "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Install dependencies
        run: npm install

      - name: Patch react-native-gradle-plugin
        run: |
          python3 - <<'PY'
          import os

          p = "node_modules/react-native-gradle-plugin/build.gradle.kts"
          if os.path.exists(p):
              s = open(p).read()
              if "skip-metadata-version-check" not in s:
                  s += "\ntasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { kotlinOptions.freeCompilerArgs = kotlinOptions.freeCompilerArgs + \"-Xskip-metadata-version-check\"; kotlinOptions.jvmTarget = \"17\" }\n"
                  open(p, "w").write(s)
                  print("patched")
          PY

      - name: Verify signing keystore
        run: |
          test -f android/app/debug.keystore || (echo "签名文件缺失：android/app/debug.keystore，否则每次构建签名会变化导致无法覆盖升级" && exit 1)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.0.1

      - name: Build Release APK
        working-directory: android
        run: |
          set +e
          gradle assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeManagerApp-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
